name: Release

# Builds installers for macOS (Apple Silicon), Windows and Linux, and
# publishes them as a GitHub Release. Trigger by pushing a version tag:
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# or run it manually from the Actions tab (workflow_dispatch).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            label: macOS-AppleSilicon
          - platform: ubuntu-22.04
            args: ""
            label: Linux-x86_64
          - platform: windows-latest
            args: ""
            label: Windows-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Linux (Tauri) dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libgtk-3-dev \
            libssl-dev \
            libasound2-dev \
            autoconf automake libtool

      # `audiopus_sys` 0.1.x — the version `audiopus` 0.2 pins — builds its
      # vendored libopus with the autotools, so `autoreconf` has to exist. The
      # Ubuntu images ship it, the macOS ones do not, which is why the release
      # build started failing the moment the Opus conversion target was added
      # (`Failed to autogen Opus`). Only `audiopus_sys` >= 0.2 switched to
      # cmake, and `audiopus` has no released version that depends on it yet.
      #
      # Installing them is not quite enough on macOS. Apple ships its own,
      # unrelated `/usr/bin/libtool`, so Homebrew installs the GNU ones under
      # a `g` prefix (`glibtoolize`) to avoid shadowing it — while `autoreconf`
      # looks for `libtoolize` by name and fails without it. The formula keeps
      # unprefixed copies in a `gnubin` directory exactly for this case, so
      # that goes on PATH for the steps that follow.
      - name: Install autotools for libopus (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install autoconf automake libtool
          echo "$(brew --prefix libtool)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Check the autotools are usable (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          # Fail here, with a readable message, rather than 300 lines later
          # inside a cargo build script that only says "Failed to autogen Opus".
          autoreconf --version | head -1
          libtoolize --version | head -1
          automake --version | head -1

      - name: Install frontend dependencies
        run: npm install

      # Build only — the artifacts are renamed below so every download says
      # which OS it is for, then uploaded in a separate step.
      - name: Build the app
        id: build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      # Rename every produced installer to <name>_<version>_<Platform>.<ext>
      # (e.g. FlacCompagnon_0.7.0_Windows-x64.msi) so the Releases page is
      # unambiguous. tauri-action reports the built files in `artifactPaths`
      # (a JSON array); it is written to a file rather than interpolated into
      # the script so no path can break the quoting.
      - name: Rename artifacts with the platform label
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          cat > paths.json <<'JSON'
          ${{ steps.build.outputs.artifactPaths }}
          JSON
          echo "--- tauri reported these artifacts ---"
          cat paths.json
          python3 - <<'PY'
          import json, os, re, shutil, pathlib, sys
          raw = pathlib.Path("paths.json").read_text().strip()
          if not raw:
              sys.exit("tauri-action reported no artifacts (empty artifactPaths)")
          paths = json.loads(raw)
          label = os.environ["LABEL"]
          out = pathlib.Path("dist-release")
          copied = 0
          for p in paths:
              src = pathlib.Path(p)
              if not src.exists():
                  print("skip (missing):", p)
                  continue
              # On macOS the list also contains the FlacCompagnon.app *bundle*,
              # which is a directory. A directory cannot be a release asset (and
              # copying one would raise IsADirectoryError), so skip it: the .dmg
              # next to it already carries the same application.
              if not src.is_file():
                  print("skip (directory):", src.name)
                  continue
              name = src.name
              # Split off the (possibly double) extension: .app.tar.gz, .tar.gz.sig...
              m = re.match(r"^(?P<stem>.+?)(?P<ext>(\.app)?(\.tar\.gz(\.sig)?|\.[A-Za-z0-9]+))$", name)
              stem, ext = (m.group("stem"), m.group("ext")) if m else (src.stem, src.suffix)
              # Drop the arch/locale noise Tauri adds; the label already says it.
              # The separator may be "_", "-" or "." (RPM: name-ver-rel.arch.rpm).
              stem = re.sub(r"[._-](aarch64|x64|x86_64|amd64)([_-](en-US|setup))?$", "", stem)
              dest = out / f"{stem}_{label}{ext}"
              shutil.copy2(src, dest)
              copied += 1
              print("renamed:", name, "->", dest.name)
          if copied == 0:
              sys.exit("no artifact could be copied")
          PY
        env:
          LABEL: ${{ matrix.label }}

      # Hand the renamed files to the single publish job below. Creating the
      # release from each matrix job instead would produce one *draft per job*:
      # a draft has no tag ref yet, so GitHub cannot deduplicate them.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.label }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 1

  cli:
    name: CLI (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-AppleSilicon
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x86_64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Build the standalone CLI
        run: cargo build --release -p flaccompagnon-cli --target ${{ matrix.target }}
      - name: Package the CLI
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          LABEL: ${{ matrix.label }}
        run: |
          python3 - <<'PY'
          import os, pathlib, tarfile, zipfile
          target = os.environ["TARGET"]
          label = os.environ["LABEL"]
          binary = pathlib.Path("target") / target / "release" / ("flaccompagnon.exe" if label.startswith("Windows") else "flaccompagnon")
          output = pathlib.Path("dist-cli")
          output.mkdir(exist_ok=True)
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          stem = f"flaccompagnon_{version}_{label}"
          if label.startswith("Windows"):
              with zipfile.ZipFile(output / f"{stem}.zip", "w", zipfile.ZIP_DEFLATED) as archive:
                  archive.write(binary, binary.name)
          else:
              with tarfile.open(output / f"{stem}.tar.gz", "w:gz") as archive:
                  archive.add(binary, arcname=binary.name)
          PY
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.label }}
          path: dist-cli/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [release, cli]
    runs-on: ubuntu-22.04
    steps:
      # Needed for the changelog step below: it walks the commit range since
      # the previous tag, which requires the actual git history (this job
      # otherwise only downloads build artifacts, no checkout at all).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect every platform's installers and CLI archives
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: List what will be published
        run: ls -lh dist-release

      # Every past release body was the install-instructions boilerplate
      # below and *nothing else* — no "what changed" section, ever. This
      # can't fully write itself (commit subjects here are terse: "Export
      # JSON", "Fix CI"), so it generates a real commit list plus a clearly
      # marked placeholder, forcing a deliberate pass over "Highlights"
      # before hitting Publish on the draft rather than that section quietly
      # never existing.
      - name: Draft the "what's new" section
        run: |
          set -euo pipefail
          prev_tag=$(git tag --sort=-v:refname | grep -A1 "^${GITHUB_REF_NAME}$" | tail -n1)
          {
            echo "## What's new in ${GITHUB_REF_NAME}"
            echo
            echo "<!-- TODO before publishing: replace this with 2-4 real highlight bullets. -->"
            echo
            if [ -n "$prev_tag" ] && [ "$prev_tag" != "$GITHUB_REF_NAME" ]; then
              echo "<details><summary>Commits since ${prev_tag}</summary>"
              echo
              git log --no-merges --pretty=format:'- %s (%h)' "${prev_tag}..${GITHUB_REF_NAME}"
              echo
              echo
              echo "</details>"
            else
              echo "_First tagged release — no previous tag to diff against._"
            fi
          } > release-notes.md

      - name: Append the install instructions
        run: |
          cat >> release-notes.md <<'EOF'

          ---

          Cross-platform builds of FlacCompagnon. **Every file name ends with
          its platform**, so pick the one that matches your system:

          | Your system | Download |
          | --- | --- |
          | **Windows** (10/11, 64-bit) | `..._Windows-x64.msi` — the installer |
          | **macOS** (Apple Silicon: M1/M2/M3/M4) | `..._macOS-AppleSilicon.dmg` — the installer |
          | **Linux** (any distro, 64-bit) | `..._Linux-x86_64.AppImage` — portable, just make it executable |
          | **Linux** (Debian / Ubuntu) | `..._Linux-x86_64.deb` — system package |

          Each platform also has a standalone `flaccompagnon_<version>_<Platform>.tar.gz`
          (or `.zip` on Windows). Extract it and run `flaccompagnon --help`.

          The macOS `.app.tar.gz` is the same app as the `.dmg`, just archived —
          use the `.dmg` unless you specifically want the raw bundle.

          **macOS — first launch.** These builds are **not signed with an Apple
          Developer ID**, so Gatekeeper will say the app "is damaged" or "cannot
          be opened". This is expected for an open-source app without a paid
          Apple certificate. To open it, drag **FlacCompagnon.app** to
          `/Applications`, then run once in Terminal:

          ```
          xattr -dr com.apple.quarantine /Applications/FlacCompagnon.app
          ```

          (Alternatively: right-click the app → **Open** → **Open**, or allow it
          from **System Settings → Privacy & Security**.)

          **ffmpeg** is **not** bundled — install it separately for spectrograms
          and DSD content analysis (macOS: `brew install ffmpeg`,
          Debian/Ubuntu: `sudo apt install ffmpeg`, Windows: `choco install ffmpeg`).

          **Licenses.** The desktop application, CLI and services are MIT. The
          reusable `flaccompagnon-core` analysis engine included in the app and
          CLI is MPL-2.0. Its corresponding source and license are available at
          https://github.com/craft-and-code/FlacCompagnon/tree/${{ github.ref_name }}/core.
          EOF

      - name: Publish the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "FlacCompagnon ${{ github.ref_name }}"
          draft: true
          prerelease: false
          files: dist-release/*
          body_path: release-notes.md
