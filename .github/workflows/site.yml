name: Site

# Builds the landing page and bilingual guides, then publishes at the root.
# `keep_files: true` preserves the Rust docs published under gh-pages/doc by the
# Docs workflow — the two coexist. Both workflows share the `pages` concurrency
# group so they never push to the branch at the same time.

on:
  push:
    branches: [main, master]
    paths:
      - "site/**"
      - "docs/**"
      - "scripts/build-site.mjs"
      - "scripts/check-site.mjs"
      - "scripts/site/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install site build dependencies
        run: npm ci
      - name: Build and check the bilingual site
        run: npm run build:site
      - name: Publish site to gh-pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-site
          keep_files: true
          # Without this, a run whose content matches gh-pages pushes nothing,
          # so GitHub never starts a new "pages build and deployment" and the
          # previous deployment status (possibly a failed one) stays current.
          # An empty commit guarantees a manual re-run actually redeploys.
          allow_empty_commit: ${{ github.event_name == 'workflow_dispatch' }}
