name: Docs

# Builds the Rust API documentation (rustdoc) for the core analysis crate and
# publishes it into the `doc/` sub-folder of the `gh-pages` branch. Keeping it in
# a sub-folder (with keep_files) means it coexists with a static presentation
# site served from the root of the same branch — neither overwrites the other.
#
# One-time setup: Settings -> Pages -> Source: "Deploy from a branch" ->
# Branch: gh-pages / (root). The docs are then served at:
#   https://<owner>.github.io/FlacCompagnon/doc/

on:
  push:
    branches: [main, master]
    # Only rebuild the API docs when the documented code (or this workflow)
    # changes. Without this, a site-only commit would trigger both Docs and
    # Site, each pushing to gh-pages — the two resulting Pages builds then race
    # and cancel each other (harmless, but noisy red annotations).
    paths:
      - "core/**"
      - "spectrogram/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write # needed to push to the gh-pages branch

# Shared with the Site workflow: both push to gh-pages (this one into doc/, the
# other into the root), so they must never run at the same time or one push
# would land on a stale checkout of the branch and clobber the other's files.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  audio-source:
    runs-on: ubuntu-22.04
    outputs:
      release: ${{ steps.audio.outputs.release }}
      revision: ${{ steps.audio.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select the latest published stable Aède release once
        id: audio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/audio-source.mjs --resolve

  docs:
    needs: audio-source
    env:
      AEDE_AUDIO_RELEASE: ${{ needs.audio-source.outputs.release }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare the selected stable audio dependency
        run: node scripts/audio-source.mjs
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build rustdoc for the core crate
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps -p flaccompagnon-core -p flaccompagnon-spectrogram

      - name: Redirect the doc/ root to the crate docs
        run: echo '<meta http-equiv="refresh" content="0;url=flaccompagnon_core/index.html">' > target/doc/index.html

      - name: Publish to gh-pages/doc
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/doc
          destination_dir: doc
          keep_files: true # don't wipe the static site at the branch root
