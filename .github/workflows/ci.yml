name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      # Validate platform-specific audio and credential-store dependencies on
      # main so Windows compilation failures are caught before tagging a release.
      - name: Compile the whole workspace for Windows (tests included)
        run: cargo check --workspace --all-targets --locked

  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux (Tauri) dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libgtk-3-dev \
            libssl-dev \
            libasound2-dev \
            autoconf automake libtool
          # autoconf/automake/libtool are for `audiopus_sys` 0.1.x (pinned by
          # `audiopus` 0.2), which builds its vendored libopus with the
          # autotools rather than cmake. Listed explicitly even though the
          # Ubuntu runner image already ships them, so that this build doesn't
          # silently depend on what a hosted image happens to include — the
          # macOS runner doesn't, and that is exactly how the release build
          # broke.

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Check Tauri Rust/JavaScript compatibility
        run: npm run check:tauri

      - name: Audit frontend dependencies
        run: npm audit

      - name: Install Rust dependency auditor
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit Rust dependencies
        run: cargo audit

      - name: Rust formatting
        run: cargo fmt --all --check

      # `--workspace`, not `-p flaccompagnon-core`: the Tauri crate has unit
      # tests of its own (path validation in `commands/rename.rs`, the worker
      # pool in `commands/batch.rs`, `common_root` in `commands/convert.rs`)
      # and none of them had ever run on CI — `cargo build` doesn't even
      # compile `#[cfg(test)]` code, so they were only ever exercised on the
      # maintainer's machine.
      - name: Unit + integration tests (whole workspace)
        run: cargo test --workspace --locked --verbose

      # AGENTS.md requires clippy to be clean, warnings included — but nothing
      # enforced it here, so the rule rested entirely on remembering to run it.
      # `--all-targets` matters as much as the step itself: plain `cargo
      # clippy` skips everything under `#[cfg(test)]`, which in a repo that
      # asks for thorough tests is a large blind spot.
      #
      # `-D warnings` makes this blocking, which is the point. The cost to know
      # about: the toolchain above floats on stable, so a new Rust release can
      # introduce a lint that reddens an untouched file. When that happens the
      # fix is to address the lint or, if it is genuinely wrong for the code in
      # question, a scoped `#[allow]` with a comment — never to quietly drop
      # this flag.
      - name: Lints (clippy, tests included)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build frontend (typecheck + bundle)
        run: npm run build

      - name: AppImage packaging regression tests
        run: python3 -m unittest discover -s tests -p "appimage*_test.py"

      - name: Frontend and site regression tests
        run: npm test

      - name: Documentation formatting
        run: npm run check:markdown

      - name: Build and validate documentation site
        run: npm run build:site

      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --locked --no-deps

      - name: Compile the whole workspace (core, services, CLI, desktop)
        run: cargo build --workspace --locked
