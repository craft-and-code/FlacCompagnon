# Cargo workspace for FlacCompagnon.
#
# `core`      -> pure Rust analysis library (no Tauri dependency, fully unit-testable)
# `src-tauri` -> the Tauri desktop application that wraps `core`
[workspace]
members = ["core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "MIT"
authors = ["FlacCompagnon contributors"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# The analysis core is heavy DSP (FFT/MDCT sweeps over thousands of frames).
# Unoptimized, a plain `cargo test` takes minutes per analyzed file; optimizing
# just the hot crates in dev/test builds keeps the edit-compile loop fast while
# making the test suite run in seconds without needing `--release`.
[profile.dev.package.flaccompagnon-core]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
