[package]
name = "flaccompagnon-spectrogram"
description = "Streaming audio spectrograms and lossless PNG rendering in pure Rust."
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
authors.workspace = true

[dependencies]
rustfft = "6"
png = "=0.18.1"
# Rasterize the embedded OFL font without a system font or platform renderer.
fontdue = "=0.9.5"
thiserror = "1"
